<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disaster Response Coordination Platform | PBL Emergency Management</title>
  
  <!-- Tailwind CSS CDN with dark mode support -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            },
            severity: {
              critical: '#ef4444',
              high: '#f97316',
              medium: '#eab308',
              low: '#10b981',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Leaflet CSS & JS for Interactive Emergency Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Chart.js for Telemetry & Feature Importance -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Emergency Center Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[#0b0f17] text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-white">
  <!-- Root React Mount Container -->
  <div id="root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="w-16 h-16 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <h2 class="text-xl font-bold tracking-wider text-slate-200">INITIALIZING DISASTER COORDINATION PLATFORM...</h2>
        <p class="text-sm text-slate-400 mt-1">Connecting to Emergency Operations Center Backend</p>
      </div>
    </div>
  </div>

  <!-- Application Bundle -->
  <script type="text/babel" src="/static/js/app.js"></script>
</body>
</html>
